# Copiar a whatsapp.local.properties, que Git ignora. Nunca enviar este archivo con secretos.
odontocare.whatsapp.enabled=false
odontocare.whatsapp.account-sid=AC_REEMPLAZAR_CON_ACCOUNT_SID
odontocare.whatsapp.auth-token=REEMPLAZAR_CON_AUTH_TOKEN
odontocare.whatsapp.sender=whatsapp:+REEMPLAZAR_NUMERO_DE_PRUEBA
odontocare.whatsapp.public-base-url=https://REEMPLAZAR_DOMINIO.ngrok-free.app
odontocare.whatsapp.allowed-participants=+51REEMPLAZAR_TU_TELEFONO
# TEMPLATE para el trial nuevo. TEXT solo si Twilio permite cuerpos personalizados.
odontocare.whatsapp.send-mode=TEMPLATE
odontocare.whatsapp.test-template-sid=HX_REEMPLAZAR_PLANTILLA_PREDEFINIDA_SIN_VARIABLES
odontocare.whatsapp.worker-enabled=true
